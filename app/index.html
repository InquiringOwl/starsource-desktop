<style>/* StarSource: Inquire's EVE-style console (dark glass windows, corner ticks, Saira labels, c1–c5 content colours)
   laid out like a Homeworld 3 tactical HUD: top command strip with key badges, left list panel, right collapsible
   stats panel, bottom-left unit cards (chart slots), bottom-centre time console, bottom-right action buttons.
   UI chrome uses var(--frame) (follows the theme); c1–c5 and the element/aspect colours are content and never change. */
[hidden]{display:none!important}
:root{
  color-scheme: dark;
  --void:#05070C; --ink:#0A0F18; --panel:#101826; --panel-2:#152034; --panel-3:#1B2740;
  --line:#22304A; --line-2:#33445F; --text:#DDE4EF; --muted:#8B97AE; --faint:#58647D;
  --amber:#F2B84B; --cyan:#5CC8E0; --pink:#F07CA0; --violet:#B49BFF; --green:#7BD88F; --magenta:#D97AE6; --red:#E5675B; --gold:#F5D46B;
  /* content colours: elements and aspect families */
  --el-fire:#E5675B; --el-earth:#7BD88F; --el-air:#F2B84B; --el-water:#5CC8E0;
  --as-conj:#F2B84B; --as-hard:#E5675B; --as-soft:#5CC8E0; --as-minor:#B49BFF; --as-creative:#7BD88F;
  /* theme surfaces (Settings → Appearance rewrites these) */
  --frame:#5CC8E0; --tint-1:rgba(92,200,224,.10); --tint-2:rgba(180,155,255,.08);
  --hud-1:rgba(16,24,38,.86); --hud-2:rgba(9,14,23,.9); --hud-head:rgba(30,44,70,.85); --hud-row:rgba(24,36,58,.55); --hud-row-h:rgba(40,60,96,.7);
  --chrome-1:rgba(15,22,36,.92); --chrome-2:rgba(8,12,20,.92); --blur:6px;
  --kbd-bg:#E6ECF5; --kbd-fg:#0A0F18;
  --math:"STIX Two Text","Noto Sans Symbols","Noto Sans Symbols 2",Cambria,Georgia,serif;
  --sans:"IBM Plex Sans","Noto Sans Symbols","Noto Sans Symbols 2",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono","Noto Sans Symbols","Noto Sans Symbols 2",ui-monospace,Menlo,monospace;
  --ui:"Saira Semi Condensed","Arial Narrow","IBM Plex Sans",sans-serif;
  --glyph:"Noto Sans Symbols","Noto Sans Symbols 2","STIX Two Text",serif;
  --ts:1;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--void);overflow:hidden}
body{color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--frame);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--frame) 35%,transparent)}
.g{font-family:var(--glyph);font-style:normal;font-weight:400}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.c1{color:var(--amber)} .c2{color:var(--cyan)} .c3{color:var(--pink)} .c4{color:var(--violet)} .c5{color:var(--green)}
.el-fire{color:var(--el-fire)} .el-earth{color:var(--el-earth)} .el-air{color:var(--el-air)} .el-water{color:var(--el-water)}

/* ---------- space backdrop ---------- */
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* ---------- key badge (Homeworld-style) ---------- */
kbd{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;background:var(--kbd-bg);color:var(--kbd-fg);
  font:700 10px/1 var(--ui);letter-spacing:.02em;border-radius:2px;box-shadow:0 1px 0 rgba(0,0,0,.5)}
kbd.dim{background:transparent;color:var(--muted);border:1px solid var(--line-2)}

/* ---------- top command strip ---------- */
.topbar{display:flex;align-items:center;gap:6px;padding:7px 12px;padding-left:max(12px,env(titlebar-area-x,0px));min-height:46px;
  background:linear-gradient(180deg,var(--chrome-1),var(--chrome-2));border-bottom:1px solid var(--line);backdrop-filter:blur(var(--blur));
  -webkit-app-region:drag;position:relative;z-index:5}
.topbar>*{-webkit-app-region:no-drag}
body.mac .topbar{padding-left:84px}
.tb-btn{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;background:rgba(255,255,255,.035);border:1px solid var(--line);
  font:600 12.5px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--text);cursor:pointer;border-radius:1px;white-space:nowrap}
.tb-btn:hover{background:color-mix(in srgb,var(--frame) 14%,transparent);border-color:color-mix(in srgb,var(--frame) 55%,var(--line))}
.tb-btn.on{background:color-mix(in srgb,var(--frame) 22%,transparent);border-color:var(--frame);color:#fff}
.tb-btn .arrow{font-size:14px;line-height:1}
.brand{display:flex;align-items:center;gap:9px;margin:0 8px 0 4px;cursor:pointer;background:none;border:0;padding:0}
.brand svg{width:28px;height:28px;display:block}
.brand b{font:600 14px/1 var(--ui);letter-spacing:.3em;text-transform:uppercase}
.tb-sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.res{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;font:600 13px/1 var(--mono);border:1px solid var(--line);background:rgba(0,0,0,.25);white-space:nowrap}
.res.gold{background:linear-gradient(180deg,#F5D46B,#E2B53E);color:#1A1405;border-color:#F5D46B}
.res .lbl{font:600 10px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.upd-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}

/* ---------- console window (Inquire .win) ---------- */
.win{background:linear-gradient(180deg,var(--hud-1),var(--hud-2));border:1px solid var(--line);position:relative;backdrop-filter:blur(var(--blur))}
.win::before{content:"";position:absolute;left:-1px;top:-1px;width:12px;height:12px;border-left:2px solid var(--frame);border-top:2px solid var(--frame);opacity:.75;pointer-events:none}
.win::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-right:2px solid var(--frame);border-bottom:2px solid var(--frame);opacity:.35;pointer-events:none}
.win-h{display:flex;align-items:center;gap:9px;padding:8px 11px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.05),transparent);
  font:600 12px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--text)}
.win-h .dot{width:6px;height:6px;background:var(--frame);box-shadow:0 0 8px var(--frame);flex:none}
.win-h .sp{margin-left:auto}
.hud-title{font:700 20px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;padding:10px 12px 8px;color:#fff;
  background:linear-gradient(90deg,var(--hud-head),transparent);border-bottom:1px solid var(--line)}

/* ---------- chart screen layout ---------- */
.hud{position:relative;height:100%;min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr) auto;gap:10px;padding:10px}
.hud.left-off{grid-template-columns:0 minmax(0,1fr) 380px}
.hud.right-off{grid-template-columns:300px minmax(0,1fr) 0}
.hud.left-off.right-off{grid-template-columns:0 minmax(0,1fr) 0}
.hud-left,.hud-right{min-height:0;display:flex;flex-direction:column;overflow:hidden}
.hud-left .scroll,.hud-right .scroll{overflow:auto;min-height:0;flex:1;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.stage{position:relative;min-width:0;min-height:0;display:grid;place-items:center}
#wheel-host{position:absolute;inset:0}
.stage svg.wheel{width:100%;height:100%;display:block;overflow:visible}
.stage .caption{position:absolute;z-index:2;left:8px;top:2px;font:600 11px/1.5 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);pointer-events:none}
.stage .caption b{color:var(--text);font-weight:600;letter-spacing:.1em}
.stage .caption .who{font:400 22px/1.2 var(--math);letter-spacing:0;text-transform:none;color:#fff;display:block}
.stage .hint{position:absolute;right:8px;top:4px;pointer-events:none;z-index:2;font:500 11px/1.4 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:right}
.stage .hint b{color:var(--amber)}
.fold{position:absolute;top:50%;width:14px;height:64px;transform:translateY(-50%);background:var(--hud-1);border:1px solid var(--line);color:var(--muted);cursor:pointer;z-index:3;display:grid;place-items:center;font-size:10px;padding:0}
.fold:hover{color:var(--text);border-color:var(--frame)}
.fold.l{left:-10px} .fold.r{right:-10px}

/* left list (Population-style rows) */
.sec{border-bottom:1px solid var(--line)}
.sec-h{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;background:var(--hud-head);border:0;border-top:1px solid rgba(255,255,255,.04);cursor:pointer;
  font:600 11.5px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--text);text-align:left}
.sec-h .chev{margin-left:auto;transition:transform .2s;color:var(--muted);font-size:10px}
.sec.closed .sec-h .chev{transform:rotate(-90deg)}
.sec.closed .sec-b{display:none}
.sec-h .cnt{font:600 11px/1 var(--mono);letter-spacing:0;color:var(--green);padding:2px 5px;background:rgba(0,0,0,.3);border:1px solid var(--line)}
.sec-b{padding:6px}
.row{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;margin:2px 0;background:var(--hud-row);border:1px solid transparent;cursor:pointer;text-align:left;font:500 13.5px/1.25 var(--sans);color:var(--text);border-radius:1px}
.row:hover{background:var(--hud-row-h)}
.row.on{border-color:var(--frame);background:color-mix(in srgb,var(--frame) 18%,var(--hud-row))}
.row.dim{opacity:.45;cursor:default}
.row .chip{font:600 11px/1 var(--mono);color:var(--green);min-width:38px}
.row .chip.off{color:var(--faint)}
.row .soon{margin-left:auto;font:600 9.5px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line);padding:2px 4px}
.row kbd{margin-left:auto}
.field{display:grid;gap:4px;margin:4px 2px 8px}
.field>label,.lab{font:600 10.5px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sel,.inp{width:100%;height:30px;background:rgba(0,0,0,.35);border:1px solid var(--line-2);color:var(--text);padding:0 8px;border-radius:1px;font:500 13px/1 var(--sans)}
.sel:hover,.inp:hover{border-color:color-mix(in srgb,var(--frame) 60%,var(--line-2))}
select.sel option,select.sel optgroup{background:#0E1522;color:var(--text)}
.seg{display:flex;border:1px solid var(--line-2);background:rgba(0,0,0,.3)}
.seg button{flex:1;height:28px;background:none;border:0;border-right:1px solid var(--line);cursor:pointer;font:600 11px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button.on{background:color-mix(in srgb,var(--frame) 24%,transparent);color:#fff}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{height:28px;padding:0 10px;background:rgba(255,255,255,.04);border:1px solid var(--line-2);cursor:pointer;font:600 11px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--text);border-radius:1px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--frame);background:color-mix(in srgb,var(--frame) 12%,transparent)}
.btn.pri{background:color-mix(in srgb,var(--frame) 28%,transparent);border-color:var(--frame);color:#fff}
.btn.gold{background:linear-gradient(180deg,#F5D46B,#E2B53E);color:#1A1405;border-color:#F5D46B}
.btn.danger:hover{border-color:var(--red);background:rgba(229,103,91,.15)}
.toggles{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px}
.tg{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;background:var(--hud-row);border:1px solid transparent;cursor:pointer;color:var(--faint)}
.tg .g{font-size:19px;line-height:1.1}
.tg small{font:600 9px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;max-width:100%;text-overflow:ellipsis}
.tg.on{color:var(--text);border-color:color-mix(in srgb,var(--frame) 55%,transparent);background:color-mix(in srgb,var(--frame) 12%,var(--hud-row))}
.asp-row{display:grid;grid-template-columns:22px 26px 1fr 56px;align-items:center;gap:6px;padding:3px 6px;margin:2px 0;background:var(--hud-row);font:500 12.5px/1.2 var(--sans)}
.asp-row .g{font-size:15px;text-align:center}
.asp-row input[type=checkbox]{accent-color:var(--frame);margin:0}
.asp-row input.orb{width:56px;height:22px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--text);font:500 12px/1 var(--mono);padding:0 4px;text-align:right}
.swatch{width:18px;height:3px;display:inline-block;vertical-align:middle}
.check{display:flex;align-items:center;gap:8px;font:500 13px/1.3 var(--sans);padding:3px 2px;cursor:pointer}
.check input{accent-color:var(--frame)}
input[type=range]{accent-color:var(--frame);width:100%}

/* right stats (Carrier-panel style) */
.stat-head{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.04),transparent)}
.stat-head .nm{font:400 20px/1.15 var(--math);color:#fff}
.stat-head .meta{grid-column:1/-1;font:500 12px/1.45 var(--mono);color:var(--muted)}
.stat-head .tag{align-self:start;font:600 10px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;padding:4px 6px;border:1px solid var(--frame);color:var(--frame)}
table.st{width:100%;border-collapse:collapse;font:500 12.5px/1.3 var(--sans)}
table.st th{font:600 9.5px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:5px 5px;border-bottom:1px solid var(--line-2);white-space:nowrap}
table.st td{padding:4px 5px;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap;vertical-align:middle}
table.st tr.pick{cursor:pointer}
table.st tr.pick:hover td{background:var(--hud-row-h)}
table.st tr.sel td{background:color-mix(in srgb,var(--frame) 20%,transparent)}
table.st td.g,table.st .g{font-size:16px}
table.st td.num,.num{font-family:var(--mono);font-size:12px;text-align:right}
table.st td.pos{font-family:var(--mono);font-size:12.5px}
.rx{color:var(--red);font:600 11px/1 var(--math);margin-left:2px}
.dg{font:600 9.5px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;padding:2px 4px;border:1px solid var(--line-2);color:var(--muted);margin-right:2px;display:inline-block}
.dg.plus{color:var(--green);border-color:color-mix(in srgb,var(--green) 50%,transparent)}
.dg.minus{color:var(--red);border-color:color-mix(in srgb,var(--red) 50%,transparent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font:500 12.5px/1.35 var(--sans);padding:4px 6px}
.kv dt{color:var(--muted);font:600 10px/1.9 var(--ui);letter-spacing:.12em;text-transform:uppercase}
.kv dd{margin:0;font-family:var(--mono);font-size:12.5px;text-align:right}
.bar{height:6px;background:rgba(255,255,255,.06);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0}
.bal{display:grid;grid-template-columns:70px 1fr 24px;align-items:center;gap:8px;padding:2px 6px;font:600 10.5px/1.6 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bal b{font:600 12px/1 var(--mono);color:var(--text);text-align:right}
.grid-asp{border-collapse:collapse;margin:4px auto;font-size:12px}
.grid-asp td{width:24px;height:24px;border:1px solid rgba(255,255,255,.07);text-align:center;font-family:var(--glyph);font-size:13px;padding:0;cursor:default}
.grid-asp td.hd{background:var(--hud-head);font-size:14px}
.grid-asp td.empty{border:0}
.note{font:500 12px/1.45 var(--sans);color:var(--muted);padding:6px 8px}
.empty-msg{padding:16px;color:var(--muted);font:500 13px/1.5 var(--sans)}

/* ---------- bottom bar ---------- */
.dock{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:end}
.slots{display:flex;gap:6px;align-items:flex-end}
.slot{width:132px;height:96px;position:relative;cursor:pointer;padding:0;text-align:left;color:var(--text);
  background:linear-gradient(180deg,rgba(28,40,62,.9),rgba(12,18,30,.92));border:1px solid var(--line-2)}
.slot:hover{border-color:color-mix(in srgb,var(--frame) 60%,var(--line-2))}
.slot.on{border-color:var(--frame);box-shadow:0 0 0 1px var(--frame) inset,0 0 18px color-mix(in srgb,var(--frame) 30%,transparent)}
.slot .n{position:absolute;right:8px;top:4px;font:300 26px/1 var(--ui);color:#fff;opacity:.9}
.slot .ty{position:absolute;left:8px;top:8px;font:600 10px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--frame);max-width:84px}
.slot .when{position:absolute;left:8px;top:38px;font:500 10.5px/1.3 var(--mono);color:var(--muted);max-width:80px}
.slot .who{position:absolute;left:8px;right:46px;bottom:16px;font:400 14px/1.2 var(--math);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .mini{position:absolute;right:8px;top:34px;width:34px;height:34px;opacity:.9}
.slot .strip{position:absolute;left:4px;right:4px;bottom:5px;height:4px;background:rgba(255,255,255,.08)}
.slot .strip i{position:absolute;left:0;top:0;bottom:0;background:var(--green)}
.slot .x{position:absolute;right:2px;bottom:16px;width:18px;height:18px;border:0;background:none;color:var(--faint);cursor:pointer;font-size:12px;display:none}
.slot:hover .x{display:block}
.slot .x:hover{color:var(--red)}
.slot.add{display:grid;place-items:center;color:var(--muted);font:600 11px/1.3 var(--ui);letter-spacing:.14em;text-transform:uppercase;border-style:dashed;width:84px}
.slot.add span{font:300 30px/1 var(--ui);display:block;text-align:center}
.slots-lbl{font:600 10px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);padding:6px 0}

/* time console (bottom centre) */
.timec{padding:8px 10px 9px;display:grid;gap:7px;justify-items:center;min-width:520px}
.tc-top{display:flex;align-items:center;gap:8px;font:600 10.5px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tc-top .live{color:var(--green);display:inline-flex;align-items:center;gap:5px}
.tc-top .live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.tc-fields{display:flex;align-items:flex-end;gap:3px}
.tf{display:grid;justify-items:center;gap:2px}
.tf small{font:600 9px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tf .v{display:flex;align-items:center;border:1px solid var(--line-2);background:rgba(0,0,0,.4)}
.tf input{width:42px;height:30px;border:0;background:none;text-align:center;font:600 16px/1 var(--mono);color:#fff;padding:0}
.tf input.y{width:62px}
.tf .ud{display:flex;flex-direction:column}
.tf .ud button{width:16px;height:15px;border:0;border-left:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);cursor:pointer;font-size:8px;line-height:1;padding:0}
.tf .ud button:hover{color:#fff;background:color-mix(in srgb,var(--frame) 25%,transparent)}
.tf .ud button+button{border-top:1px solid var(--line)}
.tc-sep{font:600 16px/30px var(--mono);color:var(--faint);padding-bottom:0}
.tc-row{display:flex;gap:5px;align-items:center}
.tc-row .btn{height:26px;padding:0 8px}
.tc-row .btn.on{background:color-mix(in srgb,var(--green) 22%,transparent);border-color:var(--green);color:#fff}
.tc-row select.sel{height:26px;width:auto;font-size:12px}

/* action buttons (bottom right) */
.actions{justify-self:end;display:grid;gap:6px;justify-items:end}
.act-lbl{font:600 10px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:3px 6px;background:rgba(0,0,0,.4);border:1px solid var(--line)}
.act-row{display:flex;gap:6px}
.act{width:52px;height:52px;position:relative;background:linear-gradient(180deg,rgba(28,40,62,.92),rgba(12,18,30,.95));border:1px solid var(--line-2);cursor:pointer;color:var(--text);display:grid;place-items:center;padding:0}
.act svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.6}
.act:hover{border-color:var(--frame);color:#fff}
.act.on{border-color:var(--amber);color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.act.red{border-color:var(--red);color:var(--red)}
.act kbd{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%)}
.act-row+.act-row{margin-top:6px}

/* ---------- wheel ---------- */
.wheel text{font-family:var(--glyph);user-select:none}
.wheel .num{font-family:var(--mono)}
.wheel .lbl{font-family:var(--ui);letter-spacing:.08em}
.wheel .planet{cursor:pointer}
.wheel .planet .halo{fill:transparent;stroke:none}
.wheel .planet:hover .halo{fill:rgba(255,255,255,.08);stroke:var(--frame);stroke-width:1}
.wheel .planet.sel .halo{fill:color-mix(in srgb,var(--amber) 22%,transparent);stroke:var(--amber);stroke-width:2}
.wheel .asp{transition:opacity .2s}
.wheel.isolating .asp{opacity:.05}
.wheel.isolating .asp.hit{opacity:1}
.wheel.isolating .planet:not(.sel):not(.partner) .gl{opacity:.35}
.wheel .asp-hide .asp{display:none}

/* ---------- main menu ---------- */
.menu{height:100%;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:24px;padding:40px 48px;align-content:start}
.menu-hero{display:grid;gap:10px;align-content:start;padding-top:20px}
.menu-hero .eyebrow{font:600 12px/1 var(--ui);letter-spacing:.32em;text-transform:uppercase;color:var(--frame)}
.menu-hero h1{margin:0;font:600 64px/1 var(--ui);letter-spacing:.24em;text-transform:uppercase;color:#fff;text-shadow:0 0 30px color-mix(in srgb,var(--frame) 40%,transparent)}
.menu-hero p{margin:0;max-width:640px;font:400 19px/1.5 var(--math);color:var(--text)}
.menu-list{display:grid;gap:8px;margin-top:22px;max-width:520px}
.mbtn{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:14px;padding:12px 14px;text-align:left;cursor:pointer;color:var(--text);
  background:linear-gradient(90deg,rgba(28,40,62,.9),rgba(12,18,30,.75));border:1px solid var(--line-2);position:relative}
.mbtn:hover{border-color:var(--frame);background:linear-gradient(90deg,color-mix(in srgb,var(--frame) 22%,rgba(28,40,62,.9)),rgba(12,18,30,.75))}
.mbtn .ic{width:48px;height:48px;display:grid;place-items:center;border:1px solid var(--line-2);font:400 26px/1 var(--glyph);color:var(--frame)}
.mbtn b{display:block;font:600 17px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase}
.mbtn small{display:block;font:400 13px/1.4 var(--sans);color:var(--muted);margin-top:3px}
.mbtn.primary{border-color:var(--frame);box-shadow:0 0 24px color-mix(in srgb,var(--frame) 22%,transparent)}
.mbtn.locked{opacity:.5;cursor:default}
.mbtn.locked:hover{border-color:var(--line-2);background:linear-gradient(90deg,rgba(28,40,62,.9),rgba(12,18,30,.75))}
.menu-side{display:grid;gap:12px;align-content:start}
.skynow table.st td{font-size:13px}
.ver{font:500 11px/1 var(--mono);color:var(--faint);margin-top:16px}

/* ---------- profiles screen ---------- */
.profiles{height:100%;overflow:auto;padding:24px 32px}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:14px}
.pf-card{padding:12px 14px;display:grid;gap:6px}
.pf-card .nm{font:400 22px/1.2 var(--math);color:#fff}
.pf-card .mono{font-size:12px;color:var(--muted)}
.pf-card .big3{display:flex;gap:14px;font:500 13px/1.3 var(--sans)}
.pf-card .big3 .g{font-size:17px}
.h2{font:600 22px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase;margin:0;color:#fff;display:flex;align-items:center;gap:12px}

/* ---------- modal windows (profile creator, settings) ---------- */
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(3,5,10,.55);backdrop-filter:blur(4px)}
.modal{width:min(760px,94vw);max-height:92vh;display:flex;flex-direction:column}
.modal .body{overflow:auto;padding:14px 16px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line)}
.modal .x{margin-left:auto;background:none;border:1px solid var(--line);color:var(--muted);width:26px;height:26px;cursor:pointer}
.modal .x:hover{color:#fff;border-color:var(--frame)}
.fgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px 10px}
.fgrid .span2{grid-column:span 2} .fgrid .span3{grid-column:span 3} .fgrid .span6{grid-column:1/-1}
.fgrid .field{margin:0}
.fsec{grid-column:1/-1;font:600 11px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--frame);margin-top:8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.preview{grid-column:1/-1;font:500 12px/1.5 var(--mono);color:var(--muted);background:rgba(0,0,0,.3);border:1px solid var(--line);padding:7px 9px}
.preview b{color:var(--text);font-weight:500}
.err{color:var(--red)}
.set-win{width:min(860px,94vw);height:min(620px,90vh);display:grid;grid-template-columns:190px 1fr;grid-template-rows:auto minmax(0,1fr)}
.set-win .win-h{grid-column:1/-1}
.set-tabs{border-right:1px solid var(--line);padding:8px;display:grid;align-content:start;gap:3px}
.set-tabs button{text-align:left;padding:8px 10px;background:none;border:1px solid transparent;cursor:pointer;font:600 12px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.set-tabs button:hover{color:var(--text)}
.set-tabs button.on{color:#fff;border-color:var(--frame);background:color-mix(in srgb,var(--frame) 14%,transparent)}
.set-body{overflow:auto;padding:16px 18px}
.set-body h3{margin:0 0 10px;font:600 13px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--frame)}
.set-body p{margin:6px 0 12px;color:var(--muted);font:400 13.5px/1.55 var(--sans)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:16px}
.theme{padding:0;border:1px solid var(--line-2);cursor:pointer;background:none;text-align:left;color:var(--text)}
.theme.on{border-color:var(--frame);box-shadow:0 0 0 1px var(--frame) inset}
.theme .sw{height:46px;position:relative}
.theme .sw i{position:absolute;right:8px;bottom:8px;width:14px;height:14px;border-radius:50%}
.theme b{display:block;padding:6px 8px 2px;font:600 12px/1.2 var(--ui);letter-spacing:.1em;text-transform:uppercase}
.theme small{display:block;padding:0 8px 7px;font:400 11.5px/1.3 var(--sans);color:var(--muted)}
.upd-box{border:1px solid var(--line-2);padding:12px 14px;display:grid;gap:8px;background:rgba(0,0,0,.25)}
.upd-box .st{font:500 14px/1.4 var(--sans)}
.upd-box .prog{height:6px;background:rgba(255,255,255,.08)}
.upd-box .prog i{display:block;height:100%;background:var(--frame)}
.slider{display:grid;grid-template-columns:150px 1fr 60px;align-items:center;gap:12px;margin:10px 0}
.slider label{font:600 11px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.slider output{font:600 12px/1 var(--mono);text-align:right}
body.modal-open #app{filter:blur(2px) brightness(.8);transition:filter .25s}

/* toast */
.toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);z-index:60;padding:9px 14px;font:500 13px/1.4 var(--sans);background:var(--hud-1);border:1px solid var(--frame);box-shadow:0 8px 30px rgba(0,0,0,.4)}

/* tooltip */
.tip{position:fixed;z-index:40;pointer-events:none;padding:7px 10px;background:rgba(8,12,20,.96);border:1px solid var(--line-2);font:500 12.5px/1.45 var(--sans);max-width:320px}
.tip b{font-family:var(--math);font-weight:400;font-size:15px}
.tip .mono{font-size:12px}

/* view fade (as Inquire's vt-in) */
.vt-in{animation:vt-in .4s ease both}
@keyframes vt-in{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:none}}
[data-reduce-motion="1"] *{animation:none!important;transition:none!important}

/* smaller screens: panels narrower, then stacked */
@media (max-width:1400px){ .hud{grid-template-columns:270px minmax(0,1fr) 340px} .timec{min-width:0} .slot{width:112px} }
@media (max-width:1180px){ .dock{grid-template-columns:1fr;justify-items:center} .actions{justify-self:center} }
@media (max-width:900px){
  .hud,.hud.left-off,.hud.right-off{grid-template-columns:1fr;grid-template-rows:auto auto auto auto;overflow:auto;height:auto}
  #app{overflow:auto} #view{overflow:auto} .stage{order:-1;height:min(96vw,620px)} .hud-left,.hud-right{max-height:none} .fold{display:none}
  .menu{grid-template-columns:1fr;padding:20px 16px} .menu-hero h1{font-size:40px}
  .slots{flex-wrap:wrap;justify-content:center} .tc-fields{flex-wrap:wrap;justify-content:center}
  .topbar{flex-wrap:wrap} .tb-btn .tlbl{display:none}
}

/* visibility toggles (Show / Hide) */
.tg{position:relative}
.tg .eye{position:absolute;right:3px;top:3px;width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;opacity:.8}
.tg:not(.on) .g,.tg:not(.on) .lbl{opacity:.35}
.toggles.layers{grid-template-columns:repeat(2,1fr)}
.tg.wide{flex-direction:row;justify-content:flex-start;gap:8px;padding:7px 8px}
.tg.wide .eye{position:static;width:15px;height:15px}
.tg.wide small{font-size:10.5px}
.eyeb{background:none;border:0;color:var(--muted);cursor:pointer;padding:0 5px 0 0;font-size:11px;vertical-align:middle}
.eyeb:hover{color:var(--frame)}
table.st tr.hid td{opacity:.42}
table.st tr.hid td:first-child{opacity:1}
details.more{margin:4px 6px}
details.more summary{cursor:pointer;font:600 10.5px/2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
svg.dial{width:100%;max-width:300px}
.act-row{flex-wrap:nowrap}
.act{width:46px;height:46px}

/* ---------- Harmonics Lab ---------- */
.hlab{height:100%;display:grid;grid-template-columns:300px minmax(0,1fr) 380px;gap:10px;padding:10px;min-height:0}
.lab-side,.lab-right{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.lab-side .scroll,.lab-right .scroll{overflow:auto;flex:1;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.lab-main{display:grid;grid-template-rows:auto auto;gap:10px;align-content:start;overflow:auto;min-height:0}
.plot{padding:8px 10px}
svg.spec{width:100%;height:auto;display:block}
svg.spec .ax{font:500 11px var(--mono);fill:var(--muted)}
svg.spec .bar{cursor:pointer}
svg.spec .bar:hover path{opacity:1}
.lab-text p{margin:0 0 9px;font:400 12.5px/1.5 var(--sans);color:var(--text)}
.lab-text p.muted{color:var(--muted)}
.lab-wheel{padding:6px 10px}
.lab-wheel svg{width:100%;height:auto}
@media (max-width:1400px){ .hlab{grid-template-columns:260px minmax(0,1fr) 320px} }
@media (max-width:1100px){ .hlab{grid-template-columns:1fr;height:auto;overflow:auto} #view{overflow:auto} .lab-side,.lab-right{max-height:none} }

/* city search drop-down */
.city-dd{position:absolute;left:0;right:0;top:100%;z-index:70;margin-top:2px;background:rgba(8,12,20,.98);border:1px solid var(--frame);max-height:300px;overflow:auto;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.city-dd button{display:grid;grid-template-columns:auto 1fr;gap:0 10px;width:100%;text-align:left;padding:6px 10px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);cursor:pointer}
.city-dd button b{font:500 14px/1.3 var(--sans)}
.city-dd button span{font:400 12.5px/1.6 var(--sans);color:var(--muted)}
.city-dd button small{grid-column:1/-1;font:500 11px/1.4 var(--mono);color:var(--faint)}
.city-dd button.on,.city-dd button:hover{background:color-mix(in srgb,var(--frame) 18%,transparent)}
.city-dd .none{padding:8px 10px;color:var(--muted);font:400 12.5px var(--sans)}

/* phones and installed web app: keep clear of notches and home bars */
.topbar{padding-top:max(7px,env(safe-area-inset-top,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
@media (max-width:900px){
  .topbar{padding-left:max(10px,env(safe-area-inset-left,0px));gap:4px}
  .hud,.hlab{padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
  .tb-right .res:not(.gold){display:none}
  .act{width:44px;height:44px} .timec{padding:8px 4px}
  .tc-row{flex-wrap:wrap;justify-content:center}
  .tf input{width:36px} .tf input.y{width:54px}
  .menu-hero p{font-size:16px}
}
@media (hover:none){ .slot .x{display:block} }
@media (max-width:900px){
  .stage{order:-3} .dock{order:-2} .hud-right{order:-1} .hud-left{order:0}
  .stage .hint{display:none} .stage .caption .who{font-size:18px}
  .tb-btn kbd,.mbtn kbd{display:none}
}
@media (hover:none){ kbd{display:none} .act kbd{display:none} }
.tb-btn .tshort{display:none}
@media (max-width:900px){ .tb-btn .tshort{display:inline} .tb-btn{padding:0 8px;font-size:11.5px} }
@media (max-width:700px){
  .set-win{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr);height:min(720px,92vh)}
  .set-tabs{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;gap:4px}
  .set-tabs button{white-space:nowrap;padding:7px 9px}
  .fgrid{grid-template-columns:repeat(2,1fr)} .fgrid .span3,.fgrid .span2{grid-column:span 1} .fgrid .span6{grid-column:1/-1}
}

/* PWA glue: registers the service worker when StarSource runs as a web page (not Electron, not the native phone app),
   and reports update state to Settings → Updates through the same shape the desktop updater uses. */
(function () {
  "use strict";
  const isDesktop = !!window.starsourceDesktop, isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  const P = window.StarPWA = { kind: isDesktop ? "desktop" : isNative ? "native" : "web", state: { status: "current" }, waiting: null, listeners: [],
    onUpdate(cb) { this.listeners.push(cb); }, set(s) { this.state = s; this.listeners.forEach(f => f(s)); },
    apply() { if (this.waiting) { this.waiting.postMessage("skip-waiting"); } else location.reload(); },
    check() { if (this.reg) { this.set({ status: "checking" }); this.reg.update().then(() => { if (!this.waiting) this.set({ status: "current" }); }).catch(() => this.set({ status: "error", message: "Offline" })); } },
    installable: null, install() { if (this.installable) { this.installable.prompt(); this.installable = null; } } };
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); P.installable = e; });
  if (P.kind !== "web" || !("serviceWorker" in navigator) || !/^https?:$/.test(location.protocol) || location.hostname === "localhost" && !/[?&]sw\b/.test(location.search)) return;
  navigator.serviceWorker.register("sw.js").then(reg => {
    P.reg = reg;
    const watch = w => w && w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) { P.waiting = w; P.set({ status: "ready", version: "new" }); } });
    if (reg.waiting && navigator.serviceWorker.controller) { P.waiting = reg.waiting; P.set({ status: "ready", version: "new" }); }
    reg.addEventListener("updatefound", () => watch(reg.installing));
    setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
  }).catch(() => {});
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!reloading) { reloading = true; location.reload(); } });
})();

</script>

      const ant = norm(180 - p.lon), con = norm(360 - p.lon);
      const contacts = [];
      for (const q of pts) {
        if (q.key === p.key) continue;
        const da = A.sep(ant, q.lon), dc = A.sep(con, q.lon);
        if (da <= o) contacts.push({ kind: "antiscion", key: q.key, orb: da });
        if (dc <= o) contacts.push({ kind: "contra-antiscion", key: q.key, orb: dc });
      }
      out.push({ key: p.key, lon: p.lon, ant, con, contacts });
    }
    return out;
  }

  /* ---------- profections ---------- */
  function profection(natal, natalJd, targetJd) {
    const asc = natal.points.find(p => p.key === "asc");
    const years = (targetJd - natalJd) / A.TROPICAL_YEAR;
    const age = Math.max(0, Math.floor(years));
    const sign = (asc.sign + age) % 12;
    const month = Math.floor((years - age) * 12);
    const msign = (sign + month) % 12;
    const lord = D.SIGNS[sign].ruler, mlord = D.SIGNS[msign].ruler;
    const occupants = natal.bodies.filter(b => b.sign === sign).map(b => b.key);
    return { age, house: (age % 12) + 1, sign, lord, month: month + 1, msign, mlord, occupants, nextJd: natalJd + (age + 1) * A.TROPICAL_YEAR };
  }

  /* ---------- fixed stars ---------- */
  const STARS = ["Algol", "Alcyone", "Aldebaran", "Rigel", "Capella", "Bellatrix", "Alnilam", "Betelgeuse", "Sirius", "Canopus", "Castor", "Pollux",
    "Procyon", "Alphard", "Regulus", "Zosma", "Denebola", "Vindemiatrix", "Algorab", "Spica", "Arcturus", "Acrux", "Zubenelgenubi", "Alphecca",
    "Zubeneschamali", "Unukalhai", "Agena", "Rigil Kentaurus", "Antares", "Ras Algethi", "Rasalhague", "Shaula", "Facies", "Nunki", "Vega", "Altair",
    "Deneb Algedi", "Sadalmelik", "Fomalhaut", "Deneb", "Achernar", "Markab", "Scheat", "Algenib", "Alpheratz", "Mirach", "Hamal", "Polaris", "Alkaid"];
  /* The four Royal Stars (Persian watchers) and the fifteen Behenian stars (Hermes, Agrippa) get a tag. */
  const ROYAL = ["Aldebaran", "Regulus", "Antares", "Fomalhaut"];
  const BEHENIAN = ["Algol", "Alcyone", "Aldebaran", "Capella", "Sirius", "Procyon", "Regulus", "Algorab", "Spica", "Arcturus", "Alphecca", "Antares", "Vega", "Deneb Algedi"];
  function fixedStars(E, ch, orb) {
    const o = orb == null ? 1 : orb;
    const f = chartFlags(E, ch.opts || {});
    const targets = ch.bodies.concat(ch.points.filter(p => ["asc", "mc", "dsc", "ic"].includes(p.key)));
    const out = [];
    for (const n of STARS) {
      const s = E.fixstar(n, ch.jd, f); if (!s) continue;
      const hits = targets.filter(t => A.sep(t.lon, s.lon) <= o).map(t => ({ key: t.key, orb: A.sep(t.lon, s.lon) }));
      out.push({ name: n, id: s.name, lon: s.lon, lat: s.lat, hits, royal: ROYAL.includes(n), behenian: BEHENIAN.includes(n) });
    }
    return out.sort((a, b) => a.lon - b.lon);
  }

  const Tech = { findReturn, solarArc, harmonicChart, spectrum, wave, synthesis, midpoints, antiscia, profection, fixedStars, STARS, ROYAL, BEHENIAN, chartFlags };
  if (node) module.exports = Tech; else root.Tech = Tech;
})(typeof window !== "undefined" ? window : globalThis);

<script>/* web/src/store.js */
/* StarSource local data: profiles, chart slots and settings in localStorage (prefix "starsource.").
   Everything stays on this computer. Store.* is read by app.js and settings.js. */
(function (root) {
  "use strict";
  const D = root.AstroData;
  const K = { profiles: "starsource.profiles", slots: "starsource.slots", active: "starsource.active", settings: "starsource.settings", ui: "starsource.ui" };
  const read = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

  /* A guess at "home" from the computer's time zone, used until the user sets one (Settings → Chart defaults). */
  const ZONE_HOMES = {
    "America/Los_Angeles": [34.0522, -118.2437, "Los Angeles"], "America/Denver": [39.7392, -104.9903, "Denver"],
    "America/Chicago": [41.8781, -87.6298, "Chicago"], "America/New_York": [40.7128, -74.006, "New York"],
    "America/Phoenix": [33.4484, -112.074, "Phoenix"], "America/Anchorage": [61.2181, -149.9003, "Anchorage"],
    "Pacific/Honolulu": [21.3069, -157.8583, "Honolulu"], "Europe/London": [51.5072, -0.1276, "London"],
    "Europe/Paris": [48.8566, 2.3522, "Paris"], "Europe/Berlin": [52.52, 13.405, "Berlin"], "Asia/Tokyo": [35.6762, 139.6503, "Tokyo"],
    "Australia/Sydney": [-33.8688, 151.2093, "Sydney"], "Asia/Kolkata": [28.6139, 77.209, "New Delhi"]
  };
  const sysTz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; } catch (e) { return "UTC"; } })();
  const zh = ZONE_HOMES[sysTz] || [51.4769, 0, "Greenwich"];

  const DEF_SETTINGS = {
    theme: "deep-space", uiScale: 1, reduceMotion: false, starfield: true,
    home: { lat: zh[0], lon: zh[1], tz: ZONE_HOMES[sysTz] ? sysTz : "UTC", place: zh[2] },
    chart: {
      zodiac: "tropical", ayanamsa: 1, hsys: "P", node: "true", lilith: "mean", center: "geo", rotate: "asc",
      bodies: D.BODIES.filter(b => b.on).map(b => b.key), points: ["asc", "mc"],
      aspects: D.ASPECTS.filter(a => a.on).map(a => a.key), orbs: {}, orbScale: 1, aspGlyphs: false, showAspects: true, innerAspects: false
    }
  };
  function settings() {
    const s = read(K.settings, {});
    const out = Object.assign({}, DEF_SETTINGS, s);
    out.home = Object.assign({}, DEF_SETTINGS.home, s.home);
    out.chart = Object.assign({}, DEF_SETTINGS.chart, s.chart);
    return out;
  }
  function saveSettings(s) { write(K.settings, s); }

  function profiles() { return read(K.profiles, []); }
  function saveProfiles(list) { write(K.profiles, list); }
  function upsertProfile(p) {
    const list = profiles(); if (!p.id) p.id = uid();
    const i = list.findIndex(x => x.id === p.id);
    if (i >= 0) list[i] = p; else list.push(p);
    saveProfiles(list); return p;
  }
  function removeProfile(id) { saveProfiles(profiles().filter(p => p.id !== id)); const sl = slots().map(s => s.profile === id ? Object.assign(s, { profile: null }) : s); saveSlots(sl); }
  const profile = id => profiles().find(p => p.id === id) || null;

  function newSlot(base) {
    const c = settings().chart;
    return Object.assign({ id: uid(), type: "natal", profile: (profiles()[0] || {}).id || null, partner: null, at: null,
      zodiac: c.zodiac, ayanamsa: c.ayanamsa, hsys: c.hsys, node: c.node, lilith: c.lilith, center: c.center, rotate: c.rotate,
      bodies: c.bodies.slice(), points: c.points.slice(), aspects: c.aspects.slice(), orbs: Object.assign({}, c.orbs), orbScale: c.orbScale,
      aspGlyphs: c.aspGlyphs, showAspects: c.showAspects, innerAspects: c.innerAspects,
      layers: {}, hideSigns: [], harmonic: 5, retLoc: "current", natalRing: true, starOrb: 1 }, base ? JSON.parse(JSON.stringify(base)) : {}, base ? { id: uid() } : {});
  }
  function slots() { const s = read(K.slots, null); return Array.isArray(s) && s.length ? s : [newSlot()]; }
  function saveSlots(s) { write(K.slots, s.slice(0, 4)); }
  const active = () => read(K.active, 0);
  const setActive = i => write(K.active, i);
  const ui = () => read(K.ui, { closed: {}, leftOff: false, rightOff: false });
  const saveUi = u => write(K.ui, u);

  root.Store = { settings, saveSettings, profiles, saveProfiles, upsertProfile, removeProfile, profile, slots, saveSlots, newSlot, active, setActive, ui, saveUi, uid, sysTz, DEF_SETTINGS };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* web/src/wheel.js */
/* StarSource chart wheel: one SVG string per render (Wheel.svg(spec)). Single wheel or bi-wheel (outer ring =
   transits / progressions). Every planet is a <g class="planet" data-id="i:sun"> (i = inner ring, o = outer ring) and every
   aspect line a <line class="asp" data-a="i:sun" data-b="o:moon">, so app.js can isolate a planet's aspects with classes only.
   Geometry: viewBox −70…1070, centre 500. Longitude λ is drawn at screen angle θ = base + λ (counter-clockwise),
   base = 180° − Asc (Ascendant at 9 o'clock) or 180° (0° Aries at 9 o'clock). */
(function (root) {
  "use strict";
  const D = root.AstroData, A = root.Astro;
  const C = 500, R_OUT = 470, R_ZI = 410;
  const BODY_COL = {
    sun: "#F2B84B", moon: "#C9D6E8", mercury: "#7BD88F", venus: "#F07CA0", mars: "#E5675B", jupiter: "#B49BFF", saturn: "#C9A86A",
    uranus: "#5CC8E0", neptune: "#6FA8FF", pluto: "#D97AE6", node: "#9FB3C8", snode: "#7D8DA3", lilith: "#B07FD0", chiron: "#7FD6B0",
    ceres: "#C7D98A", pallas: "#A9C5E8", juno: "#E8A9C8", vesta: "#F0A86B",
    asc: "#FFFFFF", mc: "#FFFFFF", dsc: "#AEB9CC", ic: "#AEB9CC", vertex: "#AEB9CC", fortune: "#F5D46B", spirit: "#F5D46B"
  };
  const FAM = { conj: "var(--as-conj)", hard: "var(--as-hard)", soft: "var(--as-soft)", minor: "var(--as-minor)", creative: "var(--as-creative)" };
  const f1 = x => Math.round(x * 10) / 10;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function geom(base) {
    const P = (lon, r) => { const t = (base + lon) * Math.PI / 180; return [C + r * Math.cos(t), C - r * Math.sin(t)]; };
    return P;
  }
  /* Spread glyph positions apart so neighbours keep at least `gap` degrees (circular relaxation). */
  function spread(items, gap) {
    const s = items.map((x, i) => ({ i, lon: x.lon, p: x.lon })).sort((a, b) => a.lon - b.lon);
    const n = s.length; if (n < 2) return items.map(x => x.lon);
    if (gap * n > 350) gap = 350 / n;
    for (let it = 0; it < 300; it++) {
      let moved = false;
      for (let k = 0; k < n; k++) {
        const a = s[k], b = s[(k + 1) % n];
        let d = A.norm(b.p - a.p);
        if (n === 2 && d > 180) continue;
        if (d < gap) { const push = (gap - d) / 2 + 0.01; a.p -= push; b.p += push; moved = true; }
      }
      // pull each glyph slightly back toward its true longitude so clusters stay centred
      for (const x of s) { let d = A.norm(x.lon - x.p); if (d > 180) d -= 360; x.p += d * 0.02; }
      if (!moved) break;
    }
    const out = []; for (const x of s) out[x.i] = A.norm(x.p); return out;
  }

  function svg(spec) {
    const inner = spec.inner, outer = spec.outer, o = spec.opts || {};
    const base = o.rotate === "aries" ? 180 : 180 - inner.houses.asc;
    const P = geom(base);
    const bi = !!outer;
    const R = bi
      ? { oBand: [R_ZI, 330], oGlyph: 388, oDeg: 362, oMin: 344, iGlyph: 306, iDeg: 279, iSign: 260, iMin: 243, hOut: 228, hIn: 198 }
      : { iGlyph: 377, iDeg: 343, iSign: 318, iMin: 296, hOut: 268, hIn: 236 };
    const RA = R.hIn; // aspect circle
    const out = [];
    const L = (a, b, attrs) => `<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" ${attrs || ""}/>`;
    const T = (p, txt, attrs) => `<text x="${f1(p[0])}" y="${f1(p[1])}" text-anchor="middle" dominant-baseline="central" ${attrs || ""}>${txt}</text>`;
    const circ = (r, attrs) => `<circle cx="${C}" cy="${C}" r="${r}" ${attrs || ""}/>`;
    const sel = spec.selected || null;
    const Ly = Object.assign({ hud: true, signGlyphs: true, signTint: true, ticks: true, cusps: true, houseNums: true, axes: true, degrees: true, leaders: true, stars: true }, o.layers || {});
    const hideSigns = o.hideSigns || [];

    out.push(`<svg class="wheel${sel ? " isolating" : ""}${o.showAspects === false ? " asp-hide" : ""}" viewBox="-70 -70 1140 1140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(spec.label || "Chart wheel")}">`);
    out.push(`<defs><radialGradient id="wcore" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="rgba(92,200,224,.10)"/><stop offset=".7" stop-color="rgba(12,18,30,.55)"/><stop offset="1" stop-color="rgba(8,12,20,.85)"/></radialGradient>
      <radialGradient id="wglow" cx="50%" cy="50%" r="50%"><stop offset=".86" stop-color="rgba(0,0,0,0)"/><stop offset=".93" stop-color="color-mix(in srgb,var(--frame) 22%,transparent)"/><stop offset="1" stop-color="rgba(0,0,0,0)"/></radialGradient></defs>`);
    // HUD outer ring: glow + 5° ticks
    if (Ly.hud) out.push(circ(530, `fill="url(#wglow)"`));
    if (Ly.hud) out.push(circ(R_OUT + 22, `fill="none" stroke="var(--line-2)" stroke-width="1" opacity=".7"`));
    if (Ly.hud) for (let d = 0; d < 360; d += 5) out.push(L(P(d, R_OUT + 22), P(d, R_OUT + (d % 30 === 0 ? 34 : 27)), `stroke="var(--frame)" stroke-width="${d % 30 === 0 ? 1.6 : .8}" opacity="${d % 30 === 0 ? .8 : .35}"`));
    // body of the wheel
    out.push(circ(R_OUT, `fill="url(#wcore)" stroke="var(--line-2)" stroke-width="1.5"`));
    // zodiac ring
    for (const s of D.SIGNS) {
      const a0 = s.i * 30, a1 = a0 + 30;
      const p0 = P(a0, R_OUT), p1 = P(a1, R_OUT), q1 = P(a1, R_ZI), q0 = P(a0, R_ZI);
      out.push(`<path d="M${f1(p0[0])},${f1(p0[1])} A${R_OUT},${R_OUT} 0 0 0 ${f1(p1[0])},${f1(p1[1])} L${f1(q1[0])},${f1(q1[1])} A${R_ZI},${R_ZI} 0 0 1 ${f1(q0[0])},${f1(q0[1])} Z" fill="var(--el-${s.element})" fill-opacity="${Ly.signTint && !hideSigns.includes(s.i) ? .09 : 0}" stroke="var(--line-2)" stroke-width="1"/>`);
      if (Ly.signGlyphs && !hideSigns.includes(s.i)) out.push(T(P(a0 + 15, (R_OUT + R_ZI) / 2), s.glyph, `font-size="34" fill="var(--el-${s.element})" class="sg" data-sign="${s.i}"`));
    }
    if (Ly.ticks) for (let d = 0; d < 360; d++) {
      const len = d % 10 === 0 ? 13 : d % 5 === 0 ? 8 : 4;
      out.push(L(P(d, R_ZI), P(d, R_ZI + len), `stroke="var(--muted)" stroke-width="${d % 10 === 0 ? 1.1 : .7}" opacity=".7"`));
    }
    out.push(circ(R_ZI, `fill="none" stroke="var(--line-2)" stroke-width="1.5"`));
    if (bi) out.push(circ(R.oBand[1], `fill="rgba(0,0,0,.18)" stroke="var(--line-2)" stroke-width="1.2"`));
    // houses
    const H = inner.houses, n = H.n;
    out.push(circ(R.hOut, `fill="rgba(0,0,0,.22)" stroke="var(--line-2)" stroke-width="1"`));
    out.push(circ(RA, `fill="rgba(5,8,14,.55)" stroke="var(--line-2)" stroke-width="1.2"`));
    for (let i = 1; i <= n; i++) {
      const lon = H.cusps[i], angle = n === 12 && (i === 1 || i === 4 || i === 7 || i === 10);
      if (Ly.cusps) out.push(L(P(lon, RA), P(lon, bi ? R.oBand[1] : R_ZI), `stroke="${angle ? "var(--text)" : "var(--line-2)"}" stroke-width="${angle ? 1.8 : 1}" opacity="${angle ? .9 : .8}"`));
      const next = H.cusps[i === n ? 1 : i + 1], mid = lon + A.norm(next - lon) / 2;
      if (!Ly.houseNums) continue;
      if (n === 12) out.push(T(P(mid, (R.hOut + RA) / 2), String(i), `class="num" font-size="17" fill="var(--muted)"`));
      else if (i % 3 === 1) out.push(T(P(mid, (R.hOut + RA) / 2), String(i), `class="num" font-size="11" fill="var(--faint)"`));
    }
    // axis labels outside the wheel (inner chart)
    if (Ly.axes && (n === 12 || H.asc != null)) {
      const ax = [["AC", H.asc], ["MC", H.mc], ["DC", H.asc + 180], ["IC", H.mc + 180]];
      for (const [lab, lon] of ax) {
        const z = A.zpos(lon), p = P(lon, R_OUT + 52);
        out.push(L(P(lon, R_OUT), P(lon, R_OUT + 36), `stroke="var(--text)" stroke-width="2"`));
        out.push(`<g class="axis">${T([p[0], p[1] - 9], lab, `class="lbl" font-size="15" fill="#fff" font-weight="600"`)}${T([p[0], p[1] + 10], `${z.d}°<tspan fill="var(--el-${D.SIGNS[z.sign].element})">${D.SIGNS[z.sign].glyph}</tspan>${String(z.m).padStart(2, "0")}′`, `class="num" font-size="13" fill="var(--muted)"`)}</g>`);
      }
    }
    // aspect lines
    const pos = new Map(); // id → lon (aspect circle)
    const ringPts = (ch, ring) => ch.bodies.concat((ch.points || []).filter(p => (o.points || []).includes(p.key))).map(b => ({ ...b, id: ring + ":" + b.key }));
    const innerPts = ringPts(inner, "i"), outerPts = bi ? ringPts(outer, "o") : [];
    innerPts.concat(outerPts).forEach(b => pos.set(b.id, b.lon));
    const hitSet = new Set();
    const aspG = [];
    for (const a of spec.aspects || []) {
      const la = pos.get(a.a), lb = pos.get(a.b); if (la == null || lb == null) continue;
      const hit = sel && (a.a === sel || a.b === sel);
      if (hit) { hitSet.add(a.a); hitSet.add(a.b); }
      const dash = a.cls === "major" ? "" : a.family === "creative" ? `stroke-dasharray="2 4"` : `stroke-dasharray="7 4"`;
      const w = (a.cls === "major" ? 1 + 1.6 * a.strength : .8 + .8 * a.strength) * (hit ? 1.6 : 1);
      const p1 = P(la, RA), p2 = P(lb, RA);
      let g = `<g class="asp${hit ? " hit" : ""}" data-a="${a.a}" data-b="${a.b}">` + L(p1, p2, `stroke="${FAM[a.family]}" stroke-width="${f1(w)}" stroke-linecap="round" ${dash} opacity="${f1(.35 + .6 * a.strength)}"`);
      if (o.aspGlyphs && a.angle > 0) {
        const m = [(p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2];
        g += `<circle cx="${f1(m[0])}" cy="${f1(m[1])}" r="9" fill="rgba(5,8,14,.9)"/>` + T(m, a.glyph, `font-size="12" fill="${FAM[a.family]}"`);
      }
      aspG.push(g + "</g>");
    }
    out.push(`<g class="asps">${aspG.join("")}</g>`);
    // planet glyph rings
    const drawRing = (pts, ring) => {
      const big = ring === "i";
      const r = big ? { g: R.iGlyph, d: R.iDeg, s: R.iSign, m: R.iMin } : { g: R.oGlyph, d: R.oDeg, s: null, m: R.oMin };
      const gap = big ? (bi ? 6.4 : 5.6) : 5.2;
      const P2 = spread(pts, gap);
      const tickR = big ? (bi ? R.oBand[1] : R_ZI) : R_ZI;
      pts.forEach((b, k) => {
        const disp = P2[k], col = BODY_COL[b.key] || "#ddd";
        const z = b.z, s = D.SIGNS[z.sign];
        const isSel = sel === b.id, partner = hitSet.has(b.id) && !isSel;
        let g = `<g class="planet${isSel ? " sel" : ""}${partner ? " partner" : ""}" data-id="${b.id}" tabindex="0" role="button" aria-label="${esc(b.name)} ${z.d}° ${s.name} ${z.m}′${b.retro ? " retrograde" : ""}">`;
        g += L(P(b.lon, tickR), P(b.lon, tickR - 10), `stroke="${col}" stroke-width="2"`);
        if (Ly.leaders) g += L(P(b.lon, tickR - 10), P(disp, r.g + (big ? 20 : 16)), `stroke="${col}" stroke-width=".8" opacity=".55"`);
        g += `<circle cx="${f1(P(b.lon, RA)[0])}" cy="${f1(P(b.lon, RA)[1])}" r="3" fill="${col}"/>`;
        const gp = P(disp, r.g);
        g += `<circle class="halo" cx="${f1(gp[0])}" cy="${f1(gp[1])}" r="${big ? 20 : 16}"/>`;
        const gtxt = b.glyph.length > 3 ? b.glyph : b.glyph; // AC/MC text or symbol
        const isText = /^[A-Za-z]/.test(b.glyph);
        g += `<g class="gl">` + T(gp, esc(gtxt), `font-size="${isText ? (big ? 17 : 14) : (big ? 30 : 24)}" fill="${col}" ${isText ? 'class="lbl" font-weight="600"' : ""}`);
        if (Ly.degrees) {
          g += T(P(disp, r.d), `${z.d}°`, `class="num" font-size="${big ? 15 : 12.5}" fill="var(--text)"`);
          if (r.s) g += T(P(disp, r.s), s.glyph, `font-size="17" fill="var(--el-${s.element})"`);
          g += T(P(disp, r.m), `${String(z.m).padStart(2, "0")}′${b.retro ? "℞" : ""}`, `class="num" font-size="${big ? 12.5 : 11}" fill="${b.retro ? "var(--red)" : "var(--muted)"}"`);
        }
        g += `</g></g>`;
        out.push(g);
      });
    };
    // fixed stars: small four-point stars in the outer HUD band, named on hover
    if (Ly.stars && o.stars) for (const st of o.stars) {
      const sp = P(st.lon, R_OUT + 11), hit = st.hits && st.hits.length;
      out.push(`<g class="star"><title>${esc(st.name)} ${A.fmtLon(st.lon)}${hit ? " · conjunct " + st.hits.map(h => h.key).join(", ") : ""}</title>${T(sp, "✦", `font-size="${hit ? 15 : 11}" fill="${st.royal ? "var(--gold)" : hit ? "var(--amber)" : "var(--muted)"}" opacity="${hit ? 1 : .75}"`)}</g>`);

<script>/* web/src/starfield.js */
/* Procedural space backdrop on <canvas id="sky">: nebula clouds in the theme's colours, three layers of stars, slow twinkle.
   Original art (no game assets). StarSky.setNebula([c1, c2], bg), StarSky.enable(on, animate). */
(function () {
  "use strict";
  const cv = document.getElementById("sky"); if (!cv) return;
  const g = cv.getContext("2d");
  let neb = ["#1B3A66", "#3A2466"], bg = "#05070C", on = true, anim = true, stars = [], W = 0, H = 0, seed = 7, base = null;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  function build() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = cv.width = Math.round(innerWidth * dpr); H = cv.height = Math.round(innerHeight * dpr);
    cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
    seed = 7; stars = [];
    const n = Math.round(W * H / 2600);
    for (let i = 0; i < n; i++) stars.push({ x: rnd() * W, y: rnd() * H, r: (rnd() ** 3) * 1.6 * dpr + .3 * dpr, a: .25 + rnd() * .75, p: rnd() * 6.28, s: .3 + rnd() * 1.2, c: rnd() < .12 ? "#FFD9A0" : rnd() < .2 ? "#A9D8FF" : "#FFFFFF" });
    // static layer: background + nebula + dust band
    base = document.createElement("canvas"); base.width = W; base.height = H;
    const b = base.getContext("2d");
    b.fillStyle = bg; b.fillRect(0, 0, W, H);
    const blob = (x, y, r, col, a) => { const gr = b.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, hexA(col, a)); gr.addColorStop(1, hexA(col, 0)); b.fillStyle = gr; b.fillRect(0, 0, W, H); };
    seed = 99;
    for (let i = 0; i < 9; i++) blob(W * (.15 + rnd() * .8), H * (.05 + rnd() * .9), Math.max(W, H) * (.18 + rnd() * .3), neb[i % 2], .10 + rnd() * .14);
    // a faint galactic band
    b.save(); b.translate(W / 2, H / 2); b.rotate(-.42);
    const band = b.createLinearGradient(0, -H * .25, 0, H * .25); band.addColorStop(0, "rgba(255,255,255,0)"); band.addColorStop(.5, "rgba(220,228,255,.05)"); band.addColorStop(1, "rgba(255,255,255,0)");
    b.fillStyle = band; b.fillRect(-W, -H * .25, W * 2, H * .5); b.restore();
    const vg = b.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .75); vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.55)");
    b.fillStyle = vg; b.fillRect(0, 0, W, H);
    draw(0);
  }
  function hexA(h, a) { const v = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); return `rgba(${v.join(",")},${a})`; }
  function draw(t) {
    if (!base) return;
    g.drawImage(base, 0, 0);
    if (!on) return;
    for (const s of stars) {
      const tw = anim ? .75 + .25 * Math.sin(t / 1000 * s.s + s.p) : 1;
      g.globalAlpha = s.a * tw; g.fillStyle = s.c;
      g.beginPath(); g.arc(s.x, s.y, s.r, 0, 6.283); g.fill();
    }
    g.globalAlpha = 1;
  }
  let last = 0;
  function loop(t) { if (anim && on && !document.hidden && t - last > 66) { draw(t); last = t; } requestAnimationFrame(loop); }
  addEventListener("resize", () => { clearTimeout(build.t); build.t = setTimeout(build, 120); });
  window.StarSky = {
    setNebula(n, b) { neb = n; bg = b; build(); },
    enable(o, a) { on = o; anim = a; draw(performance.now()); }
  };
  build(); requestAnimationFrame(loop);
})();

</script>

<script>/* web/src/lab.js */
/* StarSource Harmonics Lab (#harmonics): the chart read as a signal.
   The planets are impulses on the 360° circle; Fourier analysis splits that signal into harmonics h = 1…N
   (h cycles per circle, wavelength 360°/h). For each h: amplitude R_h (mean resultant length), phase, chance level,
   Rayleigh p-value, and the planet pairs that make it strong. Selecting a harmonic shows its waveform and the H-n wheel.
   The same mathematics describes electromagnetic waves; here it is used as a measuring language, not as a claim about physics.
   Uses Tech.spectrum / Tech.wave / Tech.harmonicChart (techniques.js). Rendered by app.js when the route is #harmonics. */
(function () {
  "use strict";
  const D = window.AstroData, A = window.Astro, T = window.Tech, W = window.Wheel, ST = window.Store;
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = n => String(n).padStart(2, "0");
  const G = k => { const m = D.BODIES.find(b => b.key === k) || D.POINTS.find(p => p.key === k) || { glyph: k }; return /^[A-Za-z]/.test(m.glyph) ? `<span style="font:600 11px var(--ui)">${m.glyph}</span>` : `<span class="g" style="color:${W.BODY_COL[k] || "inherit"}">${m.glyph}</span>`; };
  const SETS = {
    planets: ["sun", "moon", "mercury", "venus", "mars", "jupiter", "saturn", "uranus", "neptune", "pluto"],
    trad: ["sun", "moon", "mercury", "venus", "mars", "jupiter", "saturn"],
    angles: ["sun", "moon", "mercury", "venus", "mars", "jupiter", "saturn", "uranus", "neptune", "pluto", "asc", "mc"]
  };
  const L = { profile: undefined, N: 36, h: 5, set: "planets", view: "wave" };
  let data = null, tip = null;

  function compute() {
    const E = StarApp.engine(), S = StarApp.state, sl = S.slots[S.active];
    if (L.profile === undefined) L.profile = sl.profile || null;
    const p = ST.profile(L.profile), home = S.set.home;
    const o = { zodiac: sl.zodiac, ayanamsa: +sl.ayanamsa, hsys: sl.hsys, node: sl.node, lilith: sl.lilith };
    let ch, title;
    if (p) { const b = A.localToUT(E, p.birth, p.birthTz || "UTC", p.birthOffset); ch = A.chart(E, Object.assign({ jd: b.jd, lat: p.birthLat, lon: p.birthLon }, o)); title = (p.first + " " + (p.last || "")).trim(); }
    else { ch = A.chart(E, Object.assign({ jd: A.nowJd(), lat: home.lat, lon: home.lon }, o)); title = "The sky now"; }
    const keys = SETS[L.set];
    const pts = ch.bodies.concat(ch.points).filter(x => keys.includes(x.key));
    const lons = pts.map(x => x.lon);
    const sp = T.spectrum(lons, L.N, { keys: pts.map(x => x.key), orb: 12 });
    data = { ch, title, pts, lons, sp, slot: sl };
    return data;
  }

  function view() {
    const profs = ST.profiles();
    return `<div class="hlab">
      <aside class="win lab-side"><div class="hud-title">Harmonics Lab</div><div class="scroll">
        <div class="sec-b">
          <div class="field"><label>Chart</label><select class="sel" data-l="profile"><option value="">— The sky now (home) —</option>${profs.map(p => `<option value="${p.id}">${esc(p.first + " " + (p.last || ""))}</option>`).join("")}</select></div>
          <div class="field"><label>Points in the signal</label><div class="seg">${[["trad", "7 classical"], ["planets", "10 planets"], ["angles", "+ AC / MC"]].map(([k, l]) => `<button data-l="set" data-v="${k}">${l}</button>`).join("")}</div></div>
          <div class="field"><label>Harmonics shown</label><div class="seg">${[12, 36, 90, 180].map(n => `<button data-l="N" data-v="${n}">1–${n}</button>`).join("")}</div></div>
          <div class="field"><label>Selected harmonic h</label><div style="display:flex;gap:6px"><button class="btn" data-hstep="-1">◀</button><input class="inp" type="number" min="1" max="180" data-l="h" style="text-align:center"><button class="btn" data-hstep="1">▶</button></div></div>
          <div class="field"><label>Lower plot</label><div class="seg"><button data-l="view" data-v="wave">Waveform h</button><button data-l="view" data-v="synth">Sum 1…h</button></div></div>
        </div>
        <div class="sec"><div class="sec-h" style="cursor:default">How to read it</div><div class="sec-b lab-text">
          <p><b>The signal.</b> Each planet is a pulse at its longitude on the 360° circle. Fourier analysis breaks that pattern of pulses into waves, one for each whole number of cycles per circle.</p>
          <p><b>Harmonic h</b> is the wave with h cycles per circle: its wavelength is 360°/h. H1 = one cycle (planets bunched on one side), H2 = oppositions and conjunctions, H3 = trines, H4 = squares, H5 = quintiles, H7 = septiles, H9 = noviles.</p>
          <p><b>Amplitude R</b> (0 to 1) measures how strongly the planets line up with that wave: 1 means every planet sits on a crest. It is the mean resultant length of the angles h·λ (Addey, <i>Harmonics in Astrology</i>; the same quantity physicists call the order parameter).</p>
          <p><b>Chance level</b> is the R expected from the same number of randomly placed points, √π / (2√k). <b>p</b> is the Rayleigh test: the probability of an R this large by chance for one harmonic. With N harmonics tested, about N × 0.05 will pass p &lt; 0.05 by luck, so a single strong bar is a description of this chart, not evidence on its own.</p>
          <p><b>Phase</b> is where the wave first peaks: the longitude the harmonic "points to".</p>
          <p class="muted">Why waves: the mathematics is the same Fourier analysis that describes electromagnetic radiation, sound and tides. It gives StarSource an exact, testable vocabulary for aspect patterns; it is not a claim that planets broadcast these waves.</p>
        </div></div>
      </div></aside>
      <section class="lab-main">
        <div class="win"><div class="win-h"><span class="dot"></span>Spectrum · amplitude by harmonic<span class="sp muted" id="lab-title"></span></div><div id="lab-spec" class="plot"></div></div>
        <div class="win"><div class="win-h"><span class="dot"></span><span id="lab-wave-t">Waveform</span></div><div id="lab-wave" class="plot"></div></div>
      </section>
      <aside class="win lab-right"><div class="hud-title" id="lab-ht">Harmonic</div><div class="scroll"><div id="lab-wheel" class="lab-wheel"></div><div id="lab-table"></div></div></aside>
    </div>`;
  }

  /* ---------- spectrum (bar chart) ---------- */
  function drawSpectrum() {
    const host = $("#lab-spec"); if (!host) return;
    const sp = data.sp, N = sp.length, Wd = 960, Hd = 250, m = { l: 44, r: 12, t: 14, b: 34 };
    const iw = Wd - m.l - m.r, ih = Hd - m.t - m.b, bw = iw / N;
    const y = v => m.t + ih * (1 - v), x = h => m.l + (h - 1) * bw;
    let g = `<svg viewBox="0 0 ${Wd} ${Hd}" class="spec" role="img" aria-label="Harmonic spectrum of ${esc(data.title)}">`;
    for (const v of [0, .25, .5, .75, 1]) g += `<line x1="${m.l}" x2="${Wd - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l - 8}" y="${y(v)}" text-anchor="end" dominant-baseline="central" class="ax">${v.toFixed(2)}</text>`;
    const step = N <= 12 ? 1 : N <= 36 ? 3 : N <= 90 ? 10 : 20;
    sp.forEach(s => {
      const h = s.h, bx = x(h) + Math.max(1, bw * .12), w = Math.max(1.5, bw * .76), top = y(s.R), on = h === L.h;
      g += `<g class="bar" data-h="${h}"><rect x="${x(h)}" y="${m.t}" width="${bw}" height="${ih}" fill="transparent"/><path d="M${bx},${y(0)} V${top + Math.min(4, (y(0) - top) / 2)} q0,-4 4,-4 h${Math.max(0, w - 8)} q4,0 4,4 V${y(0)} Z" fill="${on ? "var(--amber)" : "var(--frame)"}" opacity="${on ? 1 : .8}"/>${s.p < .05 ? `<circle cx="${bx + w / 2}" cy="${top - 7}" r="2.4" fill="var(--text)"/>` : ""}</g>`;
      if (h === 1 || h % step === 0) g += `<text x="${x(h) + bw / 2}" y="${Hd - m.b + 16}" text-anchor="middle" class="ax">${h}</text>`;
    });
    const ch = sp[0].chance;
    g += `<line x1="${m.l}" x2="${Wd - m.r}" y1="${y(ch)}" y2="${y(ch)}" stroke="var(--text)" stroke-width="1.2" stroke-dasharray="5 4" opacity=".7"/><text x="${Wd - m.r - 4}" y="${y(ch) - 7}" text-anchor="end" class="ax">chance level ${ch.toFixed(2)}</text>`;
    g += `<text x="${m.l + iw / 2}" y="${Hd - 4}" text-anchor="middle" class="ax">harmonic h (cycles per 360°) · dot = Rayleigh p &lt; 0.05</text>`;
    g += `<line x1="${m.l}" x2="${Wd - m.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line-2)" stroke-width="1"/></svg>`;
    host.innerHTML = g;
    $("#lab-title").textContent = `${data.title} · ${data.pts.length} points`;
  }

  /* ---------- waveform ---------- */
  function drawWave() {
    const host = $("#lab-wave"); if (!host) return;
    const h = L.h, Wd = 960, Hd = 230, m = { l: 44, r: 12, t: 14, b: 44 }, iw = Wd - m.l - m.r, ih = Hd - m.t - m.b;
    const pts = L.view === "synth" ? T.synthesis(data.lons, h, 721) : T.wave(data.lons, h, 721);
    const lo = L.view === "synth" ? Math.min(...pts.map(p => p[1])) : -1, hi = L.view === "synth" ? Math.max(...pts.map(p => p[1])) : 1;
    const x = t => m.l + iw * t / 360, y = v => m.t + ih * (1 - (v - lo) / (hi - lo || 1));
    let g = `<svg viewBox="0 0 ${Wd} ${Hd}" class="spec" role="img" aria-label="Waveform">`;
    for (const z of D.SIGNS) g += `<rect x="${x(z.i * 30)}" y="${Hd - m.b + 6}" width="${iw / 12 - 1}" height="16" fill="var(--el-${z.element})" opacity=".14"/><text x="${x(z.i * 30 + 15)}" y="${Hd - m.b + 15}" text-anchor="middle" dominant-baseline="central" font-family="var(--glyph)" font-size="12" fill="var(--el-${z.element})">${z.glyph}</text>`;
    g += `<line x1="${m.l}" x2="${Wd - m.r}" y1="${y(L.view === "synth" ? (lo + hi) / 2 : 0)}" y2="${y(L.view === "synth" ? (lo + hi) / 2 : 0)}" stroke="var(--line-2)"/>`;
    if (L.view !== "synth") for (let k = 0; k < h && h <= 36; k++) { const cx = (data.sp[h - 1].phase + k * 360 / h) % 360; g += `<line x1="${x(cx)}" x2="${x(cx)}" y1="${m.t}" y2="${Hd - m.b}" stroke="var(--amber)" stroke-dasharray="2 4" opacity=".55"/>`; }
    g += `<path d="${pts.map((p, i) => (i ? "L" : "M") + x(p[0]).toFixed(1) + "," + y(p[1]).toFixed(1)).join("")}" fill="none" stroke="var(--frame)" stroke-width="2"/>`;
    const sp = W.spread(data.pts.map(p => ({ lon: p.lon })), 4.2);
    data.pts.forEach((p, i) => { g += `<line x1="${x(p.lon)}" x2="${x(p.lon)}" y1="${Hd - m.b}" y2="${Hd - m.b - 10}" stroke="${W.BODY_COL[p.key]}" stroke-width="2"/><text x="${x(sp[i])}" y="${m.t + 4}" text-anchor="middle" font-family="var(--glyph)" font-size="15" fill="${W.BODY_COL[p.key]}">${/^[A-Za-z]/.test(p.glyph) ? `<tspan font-family="var(--ui)" font-size="10">${p.glyph}</tspan>` : p.glyph}</text>`; });
    [0, 90, 180, 270, 360].forEach(t => g += `<text x="${x(t)}" y="${Hd - 6}" text-anchor="middle" class="ax">${t}°</text>`);
    host.innerHTML = g + "</svg>";
    $("#lab-wave-t").textContent = L.view === "synth" ? `Sum of harmonics 1…${h}: where the chart's points concentrate` : `Waveform of H${h}: wavelength ${A.dms(360 / h).str} · crests (dashed) at the phase`;
  }

  /* ---------- harmonic wheel + table ---------- */
  function drawRight() {
    const h = L.h, s = data.sp[h - 1], hc = T.harmonicChart(data.ch, h);
    const keys = data.pts.map(p => p.key);
    const hv = Object.assign({}, hc, { bodies: hc.bodies.filter(b => keys.includes(b.key)) });
    const asp = A.aspects(hv.bodies, null, { aspects: ["conj", "opp", "tri", "sq"], luminaryBonus: false }).map(a => Object.assign(a, { a: "i:" + a.p, b: "i:" + a.q }));
    $("#lab-wheel").innerHTML = W.svg({ inner: hv, outer: null, aspects: asp, opts: { rotate: "aries", points: [], layers: { stars: false, houseNums: false, cusps: false, axes: false, hud: false } }, label: "Harmonic " + h + " wheel" });
    $("#lab-ht").textContent = `Harmonic ${h} · H${h} wheel`;
    const top = data.sp.slice().sort((a, b) => b.R - a.R).slice(0, 10);
    $("#lab-table").innerHTML = `<dl class="kv"><dt>Amplitude R</dt><dd>${s.R.toFixed(3)}</dd><dt>× chance</dt><dd>${s.ratio.toFixed(2)}×</dd><dt>Rayleigh p</dt><dd>${s.p < .001 ? "&lt; 0.001" : s.p.toFixed(3)}</dd><dt>Phase (first crest)</dt><dd>${A.fmtLon(s.phase)}</dd><dt>Wavelength</dt><dd>${A.dms(360 / h).str}</dd></dl>
      <div class="sec-h" style="cursor:default">Pairs in H${h} conjunction (≤ 12° in H${h})</div>
      <table class="st"><tr><th>Pair</th><th style="text-align:right">Natal separation</th><th style="text-align:right">Off by</th></tr>${s.pairs.slice(0, 16).map(x => `<tr><td>${G(x.a)} ${G(x.b)}</td><td class="num">${A.dms(A.sep(data.lons[x.i], data.lons[x.j])).str}</td><td class="num">${A.dms(x.dev).str}</td></tr>`).join("") || `<tr><td colspan="3" class="muted">None</td></tr>`}</table>
      <div class="sec-h" style="cursor:default">Strongest harmonics</div>
      <table class="st"><tr><th>h</th><th style="text-align:right">R</th><th style="text-align:right">× chance</th><th style="text-align:right">p</th></tr>${top.map(t => `<tr class="pick ${t.h === h ? "sel" : ""}" data-h="${t.h}"><td class="num" style="text-align:left">H${t.h}</td><td class="num">${t.R.toFixed(3)}</td><td class="num">${t.ratio.toFixed(2)}</td><td class="num">${t.p < .001 ? "&lt;.001" : t.p.toFixed(3)}</td></tr>`).join("")}</table>
      <div class="note">With ${data.sp.length} harmonics tested, about ${(data.sp.length * .05).toFixed(1)} will reach p &lt; 0.05 by chance alone.</div>`;
  }

  function syncControls() {
    const root = $(".hlab"); if (!root) return;
    $('[data-l="profile"]', root).value = L.profile || "";
    root.querySelectorAll(".seg [data-l]").forEach(b => b.classList.toggle("on", String(L[b.dataset.l]) === b.dataset.v));
    $('[data-l="h"]', root).value = L.h;
  }
  function draw() { if (!$(".hlab")) return; compute(); if (L.h > L.N) L.h = L.N; syncControls(); drawSpectrum(); drawWave(); drawRight(); }
  function showTip(h, ev) {
    const s = data.sp[h - 1];
    if (!tip) { tip = document.createElement("div"); tip.className = "tip"; document.body.appendChild(tip); }
    tip.innerHTML = `<b>H${h}</b> · wavelength ${A.dms(360 / h).str}<br>R ${s.R.toFixed(3)} · ${s.ratio.toFixed(2)}× chance · p ${s.p < .001 ? "&lt; 0.001" : s.p.toFixed(3)}<br><span class="muted">${s.pairs.length} pair${s.pairs.length === 1 ? "" : "s"} in H${h} conjunction · click to select</span>`;
    tip.style.display = "block"; tip.style.left = Math.min(innerWidth - 260, ev.clientX + 14) + "px"; tip.style.top = (ev.clientY + 12) + "px";
  }
  function wire() {
    const root = $(".hlab"); if (!root) return;
    root.addEventListener("click", e => {
      const b = e.target.closest("[data-h]"); if (b) { L.h = +b.dataset.h; draw(); return; }
      const st = e.target.closest("[data-hstep]"); if (st) { L.h = Math.max(1, Math.min(L.N, L.h + +st.dataset.hstep)); draw(); return; }
      const sg = e.target.closest(".seg [data-l]"); if (sg) { const k = sg.dataset.l; L[k] = k === "N" ? +sg.dataset.v : sg.dataset.v; draw(); }
    });
    root.addEventListener("change", e => {
      const k = e.target.dataset.l;
      if (k === "profile") { L.profile = e.target.value || null; draw(); }
      if (k === "h") { const v = Math.round(+e.target.value); if (v >= 1 && v <= L.N) { L.h = v; draw(); } }
    });
    root.addEventListener("mousemove", e => { const b = e.target.closest(".bar"); if (b) showTip(+b.dataset.h, e); else if (tip) tip.style.display = "none"; });
    root.addEventListener("mouseleave", () => { if (tip) tip.style.display = "none"; });
  }
  window.StarLab = { view, draw: () => { draw(); wire(); }, redraw: draw, state: L, keys: e => {
    if (e.key === "ArrowRight" || e.key === "]") { L.h = Math.min(L.N, L.h + 1); draw(); return true; }
    if (e.key === "ArrowLeft" || e.key === "[") { L.h = Math.max(1, L.h - 1); draw(); return true; }
    return false; } };
})();

</script>
<script>/* web/src/cities.js */
/* Offline city search for the profile creator and Settings → home. Data: app/data/cities.tsv, 135,000 places with
   1,000+ people from GeoNames (geonames.org, CC BY 4.0) via the all-the-cities package; US state names where codes match.
   Loaded on first use. Cities.attach(input, onPick) adds a drop-down; onPick({name, cc, region, country, lat, lon, tz, label}). */
(function () {
  "use strict";
  let rows = null, loading = null;
  const fold = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
  let DN = null; try { DN = new Intl.DisplayNames(["en"], { type: "region" }); } catch (e) {}
  const country = cc => { try { return (DN && DN.of(cc)) || cc; } catch (e) { return cc; } };
  function load() {
    if (rows) return Promise.resolve(rows);
    if (!loading) loading = fetch("data/cities.tsv").then(r => { if (!r.ok) throw new Error("city list missing"); return r.text(); }).then(t => {
      rows = [];
      for (const line of t.split("\n")) {
        if (!line || line[0] === "#") continue;
        const [name, cc, region, lat, lon, pop] = line.split("\t");
        rows.push({ name, cc, region, lat: +lat, lon: +lon, pop: +pop, f: fold(name) });
      }
      return rows;
    });
    return loading;
  }
  /* "paris", "paris, fr", "springfield, illinois", "san jose costa rica" → best matches, biggest first */
  function search(q, n) {
    if (!rows) return [];
    const parts = String(q).split(",").map(fold).filter(Boolean); if (!parts.length) return [];
    const head = parts[0], rest = parts.slice(1).join(" ");
    const out = [];
    for (const r of rows) {
      let score;
      if (r.f === head) score = 3; else if (r.f.startsWith(head)) score = 2; else if (head.length > 3 && r.f.includes(" " + head)) score = 1; else continue;
      if (rest) {
        const hay = fold(r.region + " " + r.cc + " " + country(r.cc));
        if (!rest.split(" ").every(w => hay.includes(w))) continue;
      }
      out.push({ r, score });
      if (out.length > 4000) break;
    }
    out.sort((a, b) => b.score - a.score || b.r.pop - a.r.pop);
    return out.slice(0, n || 10).map(x => pick(x.r));
  }
  function pick(r) {
    let tz = ""; try { tz = window.tzlookup(r.lat, r.lon); } catch (e) {}
    const ctry = country(r.cc);
    return { name: r.name, cc: r.cc, region: r.region, country: ctry, lat: r.lat, lon: r.lon, pop: r.pop, tz, label: [r.name, r.region, ctry].filter(Boolean).join(", ") };
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function attach(input, onPick) {
    const box = document.createElement("div"); box.className = "city-dd"; box.hidden = true;
    input.parentElement.style.position = "relative"; input.parentElement.appendChild(box);
    let list = [], idx = -1, t = 0;
    const render = () => {
      box.innerHTML = list.length ? list.map((c, i) => `<button type="button" class="${i === idx ? "on" : ""}" data-i="${i}"><b>${esc(c.name)}</b><span>${esc([c.region, c.country].filter(Boolean).join(", "))}</span><small>${Math.abs(c.lat).toFixed(2)}°${c.lat >= 0 ? "N" : "S"} ${Math.abs(c.lon).toFixed(2)}°${c.lon >= 0 ? "E" : "W"} · ${esc(c.tz)}</small></button>`).join("") : `<div class="none">${rows ? "No match. Type the coordinates below instead." : "Loading the city list…"}</div>`;
      box.hidden = !input.value.trim();
    };
    const run = () => { load().then(() => { list = search(input.value, 10); idx = list.length ? 0 : -1; render(); }).catch(() => { box.innerHTML = '<div class="none">City list unavailable.</div>'; box.hidden = false; }); };
    input.addEventListener("input", () => { clearTimeout(t); if (!input.value.trim()) { box.hidden = true; return; } if (!rows) render(); t = setTimeout(run, 120); });
    input.addEventListener("keydown", e => {
      if (box.hidden) return;
      if (e.key === "ArrowDown") { e.preventDefault(); idx = Math.min(list.length - 1, idx + 1); render(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); idx = Math.max(0, idx - 1); render(); }
      else if (e.key === "Enter" && idx >= 0) { e.preventDefault(); choose(idx); }
      else if (e.key === "Escape") { e.stopPropagation(); box.hidden = true; }
    });
    box.addEventListener("mousedown", e => { const b = e.target.closest("[data-i]"); if (b) { e.preventDefault(); choose(+b.dataset.i); } });
    input.addEventListener("blur", () => setTimeout(() => { box.hidden = true; }, 150));
    function choose(i) { const c = list[i]; if (!c) return; input.value = c.label; box.hidden = true; onPick(c); }
  }
  window.Cities = { load, search, attach, fold };
})();

</script>
<script>/* web/src/app.js */
/* StarSource app: screens (Main Menu, Horoscope Chart HUD, Profiles), the profile creator, slots, time console,
   actions and keyboard shortcuts. Engine: SWE (web/engine/swe.js); maths: Astro (astro.js); drawing: Wheel (wheel.js);
   data: Store (store.js); Settings window: settings.js (StarSettings). Routes: #menu, #chart, #profiles. */
(function () {
  "use strict";
  const D = window.AstroData, A = window.Astro, W = window.Wheel, ST = window.Store, T = window.Tech;
  const $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = (n, w) => String(n).padStart(w || 2, "0");
  const SIGN = i => D.SIGNS[i];
  const bodyMeta = k => D.BODIES.find(b => b.key === k) || D.POINTS.find(p => p.key === k) || { name: k, glyph: k };
  const glyphOf = k => { const m = bodyMeta(k); return /^[A-Za-z]/.test(m.glyph) ? `<span class="lbl" style="font:600 12px var(--ui)">${m.glyph}</span>` : `<span class="g" style="color:${W.BODY_COL[k] || "inherit"}">${m.glyph}</span>`; };
  const signG = i => `<span class="g el-${SIGN(i).element}">${SIGN(i).glyph}</span>`;
  const posHTML = lon => { const z = A.zpos(lon); return `${z.d}°${signG(z.sign)}${pad(z.m)}′${pad(z.s)}″`; };
  const ICON = {

  };
  const icon = k => `<svg viewBox="0 0 24 24">${ICON[k]}</svg>`;
  const LOGO = `<svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5D46B"/><stop offset="1" stop-color="var(--frame)"/></linearGradient></defs>
    <circle cx="32" cy="32" r="28" fill="none" stroke="var(--frame)" stroke-width="2" opacity=".85"/><circle cx="32" cy="32" r="20" fill="none" stroke="var(--line-2)" stroke-width="1.5"/>
